[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evrange"
version = "2.0.0"
description = "What drives the range and efficiency of battery-electric vehicles: EPA data, range decomposition, robust regression and grouped cross-validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eda", email = "didargumus3807@gmail.com" }]
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scikit-learn>=1.3", "statsmodels>=0.14", "tabulate>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Repository = "https://github.com/didargumus/ev-battery-range-analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
