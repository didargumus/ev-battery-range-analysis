name: refresh data

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "scripts/**"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Download EPA data and rerun the analysis
        run: python scripts/run_analysis.py
      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/ev_clean.csv docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh EPA data and results"
            git push
          fi
